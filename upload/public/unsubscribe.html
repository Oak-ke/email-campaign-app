<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edgevest Email Preferences - Unsubscribe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #0d0b0a; color: #f7f4ee; }
    .glass-panel {
      background: rgba(26, 20, 16, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(163, 120, 84, 0.3);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full text-center">
    <div class="inline-flex h-14 w-14 items-center justify-center rounded-2xl bg-[#faf8f5] mb-6 ring-1 ring-[#e2b871]/50">
      <img src="https://edgevest.co.ke/images/logo.png" alt="Edgevest" class="h-10 w-10 object-contain" onerror="this.style.display='none'" />
    </div>

    <div class="glass-panel rounded-2xl p-8 shadow-2xl">
      <div id="icon-wrap" class="w-12 h-12 rounded-full bg-[#1a2e26] border border-[#2d5a4c] text-[#63b39b] flex items-center justify-center mx-auto mb-4 text-xl">
        <i id="status-icon" class="fa-solid fa-check"></i>
      </div>

      <h1 id="unsub-title" class="text-xl font-bold text-white mb-2">Processing…</h1>
      <p id="unsub-msg" class="text-sm text-[#d1c4b8] leading-relaxed mb-4">
        Checking your unsubscribe request.
      </p>

      <div id="unsub-email" class="bg-[#18120e] border border-[#3d2d20] rounded-xl p-3 text-xs text-[#e2b871] font-mono mb-4 hidden"></div>

      <div id="confirm-panel" class="hidden text-left space-y-3 mb-4">
        <label class="block text-xs text-[#a8988a]">Optional reason</label>
        <textarea id="reason-input" rows="2" class="w-full bg-[#18120e] border border-[#3d2d20] rounded-xl p-3 text-xs text-white" placeholder="No longer interested…"></textarea>
        <button type="button" id="btn-confirm-unsub" class="w-full px-4 py-2.5 bg-[#8c6543] hover:bg-[#a37854] text-white text-xs font-bold rounded-xl">
          Confirm unsubscribe
        </button>
        <p id="confirm-error" class="text-xs text-rose-400 hidden"></p>
      </div>

      <a href="https://www.edgevest.co.ke" class="inline-flex items-center justify-center px-6 py-2.5 bg-[#261c17] border border-[#8c6543] text-[#e2b871] text-xs font-bold rounded-xl">
        Return to Edgevest <i class="fa-solid fa-arrow-right ml-2"></i>
      </a>
    </div>

    <p class="text-xs text-[#8c7868] mt-6">
      Edgevest Training &amp; Consultancy · Parklands, Nairobi
    </p>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var email = params.get("email") || "";
      var token = params.get("token") || "";
      var status = (params.get("status") || "").toLowerCase();

      var titleEl = document.getElementById("unsub-title");
      var msgEl = document.getElementById("unsub-msg");
      var emailEl = document.getElementById("unsub-email");
      var iconEl = document.getElementById("status-icon");
      var iconWrap = document.getElementById("icon-wrap");
      var confirmPanel = document.getElementById("confirm-panel");
      var errEl = document.getElementById("confirm-error");

      if (email) {
        emailEl.textContent = email;
        emailEl.classList.remove("hidden");
      }

      function showSuccess(already) {
        titleEl.textContent = already ? "Already unsubscribed" : "Unsubscribed successfully";
        msgEl.textContent = already
          ? "This address is already on the Edgevest suppression list. You will not receive campaign emails."
          : "Your email has been added to the Edgevest suppression list. You will no longer receive automated campaign emails.";
        iconEl.className = "fa-solid fa-check";
        iconWrap.className = "w-12 h-12 rounded-full bg-[#1a2e26] border border-[#2d5a4c] text-[#63b39b] flex items-center justify-center mx-auto mb-4 text-xl";
        confirmPanel.classList.add("hidden");
      }

      function showError(text) {
        titleEl.textContent = "Unable to unsubscribe";
        msgEl.textContent = text || "Invalid or expired link. Contact trainings@edgevest.co.ke if you still receive mail.";
        iconEl.className = "fa-solid fa-triangle-exclamation";
        iconWrap.className = "w-12 h-12 rounded-full bg-rose-950 border border-rose-700 text-rose-400 flex items-center justify-center mx-auto mb-4 text-xl";
        confirmPanel.classList.add("hidden");
      }

      function showConfirm() {
        titleEl.textContent = "Confirm unsubscribe";
        msgEl.textContent = "Click below to stop receiving Edgevest campaign emails. A valid link token is required.";
        iconEl.className = "fa-solid fa-envelope-open";
        confirmPanel.classList.remove("hidden");
      }

      if (status === "success") showSuccess(false);
      else if (status === "already") showSuccess(true);
      else if (status === "error" || status === "invalid") showError(params.get("message") || "");
      else if (email && token) showConfirm();
      else showError("Missing email or token. Use the Unsubscribe link from your email.");

      document.getElementById("btn-confirm-unsub")?.addEventListener("click", async function () {
        errEl.classList.add("hidden");
        if (!email || !token) {
          errEl.textContent = "Missing email or token.";
          errEl.classList.remove("hidden");
          return;
        }
        try {
          var res = await fetch("/api/unsubscribe", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              email: email,
              token: token,
              reason: (document.getElementById("reason-input") || {}).value || "User confirmed on unsubscribe page"
            })
          });
          var data = await res.json().catch(function () { return {}; });
          if (!res.ok || !data.success) {
            errEl.textContent = data.error || "Request failed.";
            errEl.classList.remove("hidden");
            return;
          }
          showSuccess(!!data.already);
          var u = new URL(window.location.href);
          u.searchParams.set("status", data.already ? "already" : "success");
          window.history.replaceState({}, "", u.toString());
        } catch (e) {
          errEl.textContent = e.message || "Network error";
          errEl.classList.remove("hidden");
        }
      });
    })();
  </script>
</body>
</html>
